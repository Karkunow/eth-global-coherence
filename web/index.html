<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cohesion</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
  h1 { margin-bottom: 0; }
  .tagline { color: #888; margin-top: 0.2rem; }
  fieldset { border: 1px solid #8884; border-radius: 8px; padding: 1rem; margin: 1.5rem 0; }
  legend { font-weight: 600; padding: 0 0.5rem; }
  label { display: block; margin: 0.6rem 0 0.2rem; font-size: 0.9rem; }
  input, select { width: 100%; padding: 0.4rem; box-sizing: border-box; font-size: 1rem; }
  button { padding: 0.6rem 1.2rem; font-size: 1rem; cursor: pointer; margin-top: 1rem; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .samples { font-family: ui-monospace, monospace; font-size: 0.85rem; max-height: 240px; overflow-y: auto; background: #8881; border-radius: 6px; padding: 0.5rem; margin-top: 0.8rem; }
  .sample-row { padding: 0.15rem 0; }
  .sample-row.discarded { color: #c55; }
  .result { margin-top: 1rem; padding: 1rem; border-radius: 8px; }
  .result.ok { background: #2a82; }
  .result.warn { background: #c822; }
  .result.err { background: #c552; }
  .health-figure { font-size: 2.2rem; font-weight: 700; }
  .overwrite-prompt { margin-top: 0.8rem; padding: 0.8rem; border-radius: 6px; background: #fa02; }
  .small { font-size: 0.85rem; color: #888; }
</style>
</head>
<body>

<h1>Cohesion</h1>
<p class="tagline">Does your agent's reasoning hold together?</p>

<fieldset id="calibrate-panel">
  <legend>Calibrate an agent's health baseline</legend>

  <label for="model">Model (subject under test)</label>
  <input id="model" value="deepseek-v4-flash">

  <label for="system-prompt">System prompt (optional)</label>
  <input id="system-prompt" placeholder="Leave empty for none">

  <label for="pair">Trading pair</label>
  <select id="pair">
    <option value="WETH-USDC" selected>WETH-USDC</option>
  </select>

  <label for="reps">Repetitions per context: <span id="reps-value">12</span></label>
  <input id="reps" type="range" min="9" max="15" value="12">

  <button id="calibrate-btn">Run calibration</button>
  <span class="small" id="calibrate-status"></span>

  <div id="overwrite-box" class="overwrite-prompt" style="display:none">
    A baseline already exists for this configuration (calibrated <span id="existing-date"></span>, n=<span id="existing-n"></span>).
    <button id="overwrite-btn">Overwrite it</button>
  </div>

  <div id="probe-info" class="small"></div>
  <div id="samples" class="samples" style="display:none"></div>
  <div id="calibrate-result"></div>
</fieldset>

<fieldset id="check-panel">
  <legend>Trade — advisory coherence gate</legend>

  <label for="check-model">Model (subject under test)</label>
  <input id="check-model" value="deepseek-v4-flash">

  <label for="check-pair">Trading pair</label>
  <select id="check-pair">
    <option value="WETH-USDC" selected>WETH-USDC</option>
  </select>

  <label for="check-amount">Amount in</label>
  <input id="check-amount" type="number" value="1.0" step="0.1" min="0">

  <label for="check-reps">Repetitions per context: <span id="check-reps-value">3</span></label>
  <input id="check-reps" type="range" min="1" max="15" value="3">

  <button id="check-btn">Run coherence check</button>
  <span class="small" id="check-status"></span>

  <div id="check-quote" class="small"></div>
  <div id="check-probe" class="small"></div>
  <div id="check-samples" class="samples" style="display:none"></div>

  <div id="gauge-box" style="display:none; margin-top:1rem;">
    <div class="small">disagreement_sum (perfect coherence = 2.000)</div>
    <div style="position:relative; height:28px; background:#8882; border-radius:4px; margin-top:0.3rem;">
      <div id="gauge-baseline-band" style="position:absolute; top:0; bottom:0; background:#88f4; border-radius:4px;"></div>
      <div id="gauge-ci-band" style="position:absolute; top:6px; bottom:6px; background:#8888;"></div>
      <div id="gauge-point" style="position:absolute; top:0; bottom:0; width:2px; background:#000;"></div>
      <div id="gauge-mark-2" style="position:absolute; top:0; bottom:0; width:2px; background:#0a0; right:0;"></div>
    </div>
    <div class="small" id="gauge-legend"></div>
  </div>

  <div id="check-verdict"></div>

  <div style="margin-top:1rem;">
    <button id="execute-btn" disabled>Execute — awaiting coherence check</button>
  </div>
</fieldset>

<fieldset>
  <legend>Stored baselines</legend>
  <div id="baselines-list" class="small">Loading…</div>
</fieldset>

<script>
const repsInput = document.getElementById('reps');
const repsValue = document.getElementById('reps-value');
repsInput.addEventListener('input', () => repsValue.textContent = repsInput.value);

async function loadBaselines() {
  const box = document.getElementById('baselines-list');
  try {
    const res = await fetch('/api/baselines');
    const { baselines } = await res.json();
    if (baselines.length === 0) {
      box.textContent = 'None yet — run a calibration above.';
      return;
    }
    box.innerHTML = baselines.map(b =>
      `<div>${b.model} / ${b.prompt_id} / ${b.pair.join('-')}→${b.third} — ` +
      `<b>${(b.mean_incoherence * 100).toFixed(1)}% incoherence</b> ` +
      `(n=${b.n}, calibrated ${b.calibrated_at})</div>`
    ).join('');
  } catch (e) {
    box.textContent = 'Could not load baselines: ' + e;
  }
}
loadBaselines();

async function* parseSSE(response) {
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf('\n\n')) !== -1) {
      const chunk = buf.slice(0, idx);
      buf = buf.slice(idx + 2);
      const lines = chunk.split('\n');
      let event = 'message', data = '';
      for (const line of lines) {
        if (line.startsWith('event: ')) event = line.slice(7);
        else if (line.startsWith('data: ')) data += line.slice(6);
      }
      if (data) yield { event, data: JSON.parse(data) };
    }
  }
}

async function runCalibration(overwrite) {
  const btn = document.getElementById('calibrate-btn');
  const status = document.getElementById('calibrate-status');
  const probeInfo = document.getElementById('probe-info');
  const samplesBox = document.getElementById('samples');
  const resultBox = document.getElementById('calibrate-result');
  const overwriteBox = document.getElementById('overwrite-box');

  btn.disabled = true;
  overwriteBox.style.display = 'none';
  resultBox.innerHTML = '';
  samplesBox.style.display = 'block';
  samplesBox.innerHTML = '';
  status.textContent = 'Running…';

  const body = {
    pair: document.getElementById('pair').value,
    model: document.getElementById('model').value,
    reps: parseInt(document.getElementById('reps').value, 10),
    overwrite: !!overwrite,
  };
  const sp = document.getElementById('system-prompt').value.trim();
  if (sp) body.system_prompt = sp;

  let sampleCount = 0;
  try {
    const res = await fetch('/api/calibrate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    for await (const { event, data } of parseSSE(res)) {
      if (event === 'probe') {
        probeInfo.textContent = `Probe: ${data.pair.join('/')} → ${data.third} — product ${data.product.toFixed(4)} (${data.valid ? 'valid' : 'INVALID'})`;
      } else if (event === 'exists') {
        document.getElementById('existing-date').textContent = data.calibrated_at;
        document.getElementById('existing-n').textContent = data.n;
        overwriteBox.style.display = 'block';
        status.textContent = 'Baseline already exists.';
        btn.disabled = false;
        return;
      } else if (event === 'sample') {
        sampleCount++;
        const row = document.createElement('div');
        row.className = 'sample-row' + (data.used ? '' : ' discarded');
        row.textContent = `[${data.context}] rep ${data.rep}: ` +
          (data.used ? `P(X≠Y)=${data.disagreement.toFixed(3)}  attestation: ${data.attestation.model_reported} (${data.attestation.verifiability})`
                     : 'discarded — unparseable response');
        samplesBox.appendChild(row);
        samplesBox.scrollTop = samplesBox.scrollHeight;
        status.textContent = `${sampleCount} samples landed…`;
      } else if (event === 'stored') {
        resultBox.innerHTML = `<div class="result ok">
          <div class="health-figure">${(data.mean_incoherence * 100).toFixed(1)}% incoherence</div>
          <div class="small">n=${data.n} · disagreement_sum mean ${data.mean_disagreement_sum.toFixed(3)} (must be 2.000 for perfect coherence) · std_dev ${data.std_dev.toFixed(4)}</div>
        </div>`;
        status.textContent = 'Baseline stored.';
        loadBaselines();
      } else if (event === 'error') {
        resultBox.innerHTML = `<div class="result err"><b>${data.error}</b>: ${data.detail}</div>`;
        status.textContent = 'Failed.';
      } else if (event === 'done') {
        status.textContent += ` (${(data.elapsed_ms / 1000).toFixed(1)}s total)`;
      }
    }
  } catch (e) {
    resultBox.innerHTML = `<div class="result err">Request failed: ${e}</div>`;
  } finally {
    btn.disabled = false;
  }
}

document.getElementById('calibrate-btn').addEventListener('click', () => runCalibration(false));
document.getElementById('overwrite-btn').addEventListener('click', () => runCalibration(true));

const checkRepsInput = document.getElementById('check-reps');
const checkRepsValue = document.getElementById('check-reps-value');
checkRepsInput.addEventListener('input', () => checkRepsValue.textContent = checkRepsInput.value);

function renderGauge(reading, baselineData) {
  const box = document.getElementById('gauge-box');
  box.style.display = 'block';
  // Scale: 1.0 (max incoherence, all mass on 2 possible disagreements... use
  // a fixed display range [1.0, 2.0] since disagreement_sum can't exceed 2.0
  // and rarely drops near 1.0 for a merely-drifted (not adversarial) agent.
  const lo = 1.0, hi = 2.0;
  const pct = v => Math.max(0, Math.min(100, ((v - lo) / (hi - lo)) * 100));

  const point = document.getElementById('gauge-point');
  point.style.left = pct(reading.disagreement_sum) + '%';

  const ciBand = document.getElementById('gauge-ci-band');
  if (reading.ci_low !== null && reading.ci_high !== null) {
    ciBand.style.display = 'block';
    ciBand.style.left = pct(reading.ci_low) + '%';
    ciBand.style.width = (pct(reading.ci_high) - pct(reading.ci_low)) + '%';
  } else {
    ciBand.style.display = 'none';
  }

  const baselineBand = document.getElementById('gauge-baseline-band');
  if (baselineData) {
    const bLo = baselineData.mean_disagreement_sum - baselineData.std_dev;
    const bHi = baselineData.mean_disagreement_sum + baselineData.std_dev;
    baselineBand.style.display = 'block';
    baselineBand.style.left = pct(bLo) + '%';
    baselineBand.style.width = (pct(bHi) - pct(bLo)) + '%';
  } else {
    baselineBand.style.display = 'none';
  }

  document.getElementById('gauge-legend').textContent =
    `observed ${reading.disagreement_sum.toFixed(3)}` +
    (reading.ci_low !== null ? ` [${reading.ci_low.toFixed(3)}, ${reading.ci_high.toFixed(3)}]` : ' (no CI — reps<3)') +
    (baselineData ? ` · baseline ${baselineData.mean_disagreement_sum.toFixed(3)} ± ${baselineData.std_dev.toFixed(3)}` : ' · no baseline') +
    ' · green mark = 2.000 (perfect coherence)';
}

function lockExecute(label) {
  const btn = document.getElementById('execute-btn');
  btn.disabled = true;
  btn.textContent = label;
}

function unlockExecute() {
  const btn = document.getElementById('execute-btn');
  btn.disabled = false;
  btn.textContent = 'Execute';
}

async function runCheck() {
  const btn = document.getElementById('check-btn');
  const status = document.getElementById('check-status');
  const quoteBox = document.getElementById('check-quote');
  const probeBox = document.getElementById('check-probe');
  const samplesBox = document.getElementById('check-samples');
  const verdictBox = document.getElementById('check-verdict');

  btn.disabled = true;
  lockExecute('Execute — awaiting coherence check');
  quoteBox.textContent = '';
  probeBox.textContent = '';
  samplesBox.style.display = 'block';
  samplesBox.innerHTML = '';
  verdictBox.innerHTML = '';
  document.getElementById('gauge-box').style.display = 'none';
  status.textContent = 'Running…';

  const params = new URLSearchParams({
    pair: document.getElementById('check-pair').value,
    amount: document.getElementById('check-amount').value,
    model: document.getElementById('check-model').value,
    reps: document.getElementById('check-reps').value,
  });

  let sampleCount = 0;
  let lastReading = null;
  try {
    const res = await fetch('/api/check?' + params.toString());
    for await (const { event, data } of parseSSE(res)) {
      if (event === 'quote') {
        quoteBox.textContent = `Quote (${data.source}): ${data.amount_in} → ${data.amount_out}  (fee ${data.fee_tier}, gas ~${data.gas_estimate})`;
      } else if (event === 'probe') {
        probeBox.textContent = `Probe: ${data.pair.join('/')} → ${data.third} — product ${data.product.toFixed(4)} (${data.valid ? 'valid' : 'INVALID'})`;
      } else if (event === 'baseline') {
        status.textContent = data.found ? `Comparing against baseline (n=${data.n})…` : 'No baseline for this configuration — reading will be provisional.';
      } else if (event === 'sample') {
        sampleCount++;
        const row = document.createElement('div');
        row.className = 'sample-row' + (data.used ? '' : ' discarded');
        row.textContent = `[${data.context}] rep ${data.rep}: ` +
          (data.used ? `P(X≠Y)=${data.disagreement.toFixed(3)}  attestation: ${data.attestation.model_reported} (${data.attestation.verifiability})`
                     : 'discarded — unparseable response');
        samplesBox.appendChild(row);
        samplesBox.scrollTop = samplesBox.scrollHeight;
        status.textContent = `${sampleCount} samples landed…`;
      } else if (event === 'reading') {
        lastReading = data;
      } else if (event === 'verdict') {
        const outcome = data.outcome;
        renderGauge(data.reading, data.baseline);
        if (outcome === 'PASS') {
          verdictBox.innerHTML = `<div class="result ok">
            <b>PASS</b> — confidence ${(data.confidence * 100).toFixed(0)}%, reps ${data.reading.reps}
            ${data.note ? `<div class="small">${data.note}</div>` : ''}
          </div>`;
          unlockExecute();
        } else {
          const label = outcome === 'VETO' ? 'VETO — reasoning has drifted from baseline'
                      : outcome === 'NO_BASELINE' ? 'NO BASELINE — calibrate this configuration first'
                      : 'INSUFFICIENT SAMPLES — provisional reading, not statistically confident';
          const explain = outcome === 'VETO'
            ? 'This means the agent\'s answers across isolated contexts no longer glue into a consistent picture as well as they used to — it does NOT mean this trade is unprofitable.'
            : outcome === 'NO_BASELINE'
            ? 'No prior calibration exists for this exact model/prompt/pair — run a calibration above first.'
            : 'Fewer than 3 repetitions per context were used, so no confidence interval could be computed.';
          verdictBox.innerHTML = `<div class="result warn">
            <b>${label}</b> — confidence ${(data.confidence * 100).toFixed(0)}%, reps ${data.reading.reps}
            <div class="small">${explain}</div>
            <label style="margin-top:0.5rem; display:flex; align-items:center; gap:0.4rem;">
              <input type="checkbox" id="ack-checkbox"> I understand this warning and want to proceed anyway.
            </label>
          </div>`;
          lockExecute(`Execute — ${outcome}, acknowledge warning above to proceed`);
          document.getElementById('ack-checkbox').addEventListener('change', (e) => {
            if (e.target.checked) unlockExecute();
            else lockExecute(`Execute — ${outcome}, acknowledge warning above to proceed`);
          });
        }
      } else if (event === 'error') {
        verdictBox.innerHTML = `<div class="result err"><b>${data.error}</b>: ${data.detail}</div>`;
        status.textContent = 'Failed.';
      } else if (event === 'done') {
        status.textContent += ` (${(data.elapsed_ms / 1000).toFixed(1)}s total)`;
      }
    }
  } catch (e) {
    verdictBox.innerHTML = `<div class="result err">Request failed: ${e}</div>`;
  } finally {
    btn.disabled = false;
  }
}

document.getElementById('check-btn').addEventListener('click', runCheck);
document.getElementById('execute-btn').addEventListener('click', () => {
  // No execute/submit/sign path exists in this scope (FR-027) -- the gate
  // and its acknowledgement are the extent of the action. Wallet connection
  // is an explicitly scoped stretch goal (spec.md Out of Scope).
  alert('Execution is not implemented in this build (FR-027) — wallet connection is a scoped stretch goal. The coherence gate above is the deliverable.');
});
</script>

</body>
</html>
